apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: staging-slo
  namespace: kargo-demo
spec:
  args:
    - name: version   # image tag under test (the service_version metric label)
    - name: prometheusAddress
      value: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
    - name: window
      value: 2m
  metrics:
    - name: p95-latency
      interval: 1m
      initialDelay: 2m   # let the new pods take traffic so the rate window has data
      count: 5           # 2m delay + 5 checks, one a minute: spans the 5m soak
      failureLimit: 0
      successCondition: result[0] < 10
      provider:
        prometheus:
          address: "{{ args.prometheusAddress }}"
          query: |
            histogram_quantile(0.95, sum by (le) (
              rate(http_server_request_duration_milliseconds_bucket{environment="staging",service_version="{{ args.version }}"}[{{ args.window }}])
            ))
    - name: non-2xx-ratio
      interval: 1m
      initialDelay: 2m
      count: 5
      failureLimit: 0
      successCondition: result[0] <= 0.05
      provider:
        prometheus:
          address: "{{ args.prometheusAddress }}"
          query: |
            (
              sum(rate(http_response_status_code_total{environment="staging",service_version="{{ args.version }}",status_code!~"2.."}[{{ args.window }}]))
              or vector(0)
            )
            /
            sum(rate(http_response_status_code_total{environment="staging",service_version="{{ args.version }}"}[{{ args.window }}]))
