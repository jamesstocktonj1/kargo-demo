# The Kargo pipeline for kargo-demo: Warehouse -> dev -> staging -> prod.
# Applied by the kargo-demo-pipeline Application in the cluster-ops repo, into the
# kargo-demo namespace (the Kargo Project, which already exists).
#
# A new image tag (X.Y.Z) becomes Freight. Each Stage's promotion rebuilds its own
# branch, stage/<env>, from main (the chart plus deploy/<env>/ with the new image tag),
# pushes it, then syncs the Argo CD Application kargo-demo-<env>, which tracks that
# branch. One branch per Stage means one Stage's promotion never moves another Stage's
# revision, so Kargo's health check (does the app sit on the commit I pushed?) stays true. The steps are the same for every Stage, so they live in one
# PromotionTask below.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kargo-demo
  namespace: kargo-demo
spec:
  interval: 5m
  subscriptions:
    - image:
        repoURL: ghcr.io/jamesstocktonj1/kargo-demo
        imageSelectionStrategy: SemVer   # ignores latest and sha-* tags
        constraint: ">=0.0.1"
---
# dev and staging promote by themselves; prod is promoted by hand in the UI.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargo-demo   # must equal the Project name
  namespace: kargo-demo
spec:
  promotionPolicies:
    - stage: dev
      autoPromotionEnabled: true
    - stage: staging
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-env
  namespace: kargo-demo
spec:
  vars:
    - name: env   # no default, so every Stage must set it: dev, staging or prod
    - name: gitRepo
      value: https://github.com/jamesstocktonj1/kargo-demo.git
    - name: imageRepo
      value: ghcr.io/jamesstocktonj1/kargo-demo
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        checkout:
          - branch: main
            path: ./src
          - branch: stage/${{ vars.env }}
            create: true   # first promotion creates the branch (empty)
            path: ./out
    # Rebuild the stage branch from main every time: only the chart and this
    # environment's values, with the new image tag.
    - uses: git-clear
      config:
        path: ./out
    - uses: copy
      config:
        inPath: ./src/charts
        outPath: ./out/charts
    - uses: copy
      config:
        inPath: ./src/deploy/${{ vars.env }}
        outPath: ./out/deploy/${{ vars.env }}
    - uses: yaml-update
      as: update
      config:
        path: ./out/deploy/${{ vars.env }}/values.yaml
        updates:
          - key: image.tag
            value: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: git-commit
      as: commit
      config:
        path: ./out
        message: ${{ task.outputs['update'].commitMessage }}
    - uses: git-push
      as: push
      config:
        path: ./out
    - uses: argocd-update
      config:
        apps:
          - name: kargo-demo-${{ vars.env }}
            sources:
              - repoURL: ${{ vars.gitRepo }}
                desiredRevision: ${{ task.outputs['push'].commit }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kargo-demo
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promote-env
          vars:
            - name: env
              value: dev
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: kargo-demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kargo-demo
      sources:
        stages:
          - dev   # only Freight that is already in dev can go to staging
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promote-env
          vars:
            - name: env
              value: staging
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kargo-demo
      sources:
        stages:
          - staging   # only Freight that is already in staging can go to prod
        requiredSoakTime: 5m   # ...and only after it has sat in staging this long
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promote-env
          vars:
            - name: env
              value: prod
